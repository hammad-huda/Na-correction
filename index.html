<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sodium Correction Calculator</title>
  <style>
    body { font-family: system-ui, Arial; max-width: 760px; margin: 24px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select, button { width: 100%; padding: 10px; margin-top: 6px; font-size: 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-top: 16px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    .warn { color: #b00020; font-weight: 700; }
    .muted { color: #555; }
  </style>
</head>
<body>
  <h1>Sodium Correction Calculator</h1>
  <p class="muted">
    Mixing model: Na_goal = (Na_current·TBW + Na_IVF·x) / (TBW + x). Solves for x.
  </p>

  <div class="card">
    <label for="sex">Sex</label>
    <select id="sex">
      <option value="male">Male (TBW = 0.6 × weight)</option>
      <option value="female">Female (TBW = 0.5 × weight)</option>
    </select>

    <label for="wt">Weight (kg)</label>
    <input id="wt" type="number" step="0.1" placeholder="e.g., 80" />

    <label for="naCur">Current Na (mEq/L)</label>
    <input id="naCur" type="number" step="1" placeholder="e.g., 118" />

    <label for="naGoal">Goal Na (mEq/L)</label>
    <input id="naGoal" type="number" step="1" placeholder="e.g., 124" />

    <label for="ivf">IV Fluid</label>
    <select id="ivf">
      <option value="D5W">D5W (Na = 0)</option>
      <option value="0.45NS">0.45% NS (Na = 77)</option>
      <option value="0.9NS">0.9% NS (Na = 154)</option>
      <option value="2NS">2% Saline (Na = 342)</option>
      <option value="3NS">3% Saline (Na = 513)</option>
    </select>

    <button id="calc" type="button">Calculate</button>
  </div>

  <div id="out" class="card" style="display:none;"></div>

  <script>
    const sodiumByFluid = {
      D5W: 0,
      "0.45NS": 77,
      "0.9NS": 154,
      "2NS": 342,
      "3NS": 513
    };

    document.getElementById("calc").addEventListener("click", () => {
      const sex = document.getElementById("sex").value;
      const weight = document.getElementById("wt").valueAsNumber;
      const naCurrent = document.getElementById("naCur").valueAsNumber;
      const naGoal = document.getElementById("naGoal").valueAsNumber;
      const fluid = document.getElementById("ivf").value;
      const out = document.getElementById("out");

      out.style.display = "block";

      if (![weight, naCurrent, naGoal].every(Number.isFinite)) {
        out.innerHTML = '<div class="warn">Please enter weight, current Na, and goal Na.</div>';
        return;
      }

      if (weight <= 0) {
        out.innerHTML = '<div class="warn">Weight must be greater than 0.</div>';
        return;
      }

      const tbwFactor = sex === "male" ? 0.6 : 0.5;
      const tbw = tbwFactor * weight;
      const naInf = sodiumByFluid[fluid];
      const denominator = naInf - naGoal;

      if (denominator === 0) {
        out.innerHTML = '<div class="warn">IV fluid Na equals goal Na, so the equation has a zero denominator.</div>';
        return;
      }

      const volumeLiters = tbw * (naGoal - naCurrent) / denominator;
      const volumeMl = volumeLiters * 1000;
      const rateMlPerHour = volumeMl / 24;

      const warning = volumeLiters < 0
        ? '<div class="warn">The calculated volume is negative. Check the fluid choice and goal Na.</div>'
        : "";

      out.innerHTML = `
        ${warning}
        <h2>Results</h2>
        <p><b>TBW</b> = ${tbwFactor} × ${weight} = <b>${tbw.toFixed(2)} L</b></p>
        <p><b>Current Na</b> = ${naCurrent} mEq/L</p>
        <p><b>Na<sub>IVF</sub></b> = <b>${naInf} mEq/L</b></p>

        <h3>Equation (showing work)</h3>
        <div class="mono">
          x = TBW × (Na_goal − Na_current) / (Na_IVF − Na_goal)
          <br />
          x = ${tbw.toFixed(2)} × (${naGoal} − ${naCurrent}) / (${naInf} − ${naGoal})
          <br />
          x = <b>${volumeLiters.toFixed(3)} L</b> = <b>${volumeMl.toFixed(0)} mL</b>
          <br />
          Rate over 24h = <b>${rateMlPerHour.toFixed(1)} mL/hr</b>
        </div>
      `;
    });
  </script>
</body>
</html>
